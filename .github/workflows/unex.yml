name: Unex
on:
  push:
    branches:
      - trunk

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.19"
      # .ucm-version is the authoritative pin — read it rather than repeating the
      # number here. This step used to hardcode 1.1.1 while the Dockerfile said
      # 1.2.0 and the developer's machine ran 1.3.0, so a green CI run proved
      # nothing about the image or about production.
      - name: Resolve pinned UCM version
        id: ucm
        run: echo "version=$(tr -d '[:space:]' < .ucm-version)" >> "$GITHUB_OUTPUT"

      - name: Install UCM
        run: |
          curl -fsSL "https://github.com/unisonweb/unison/releases/download/release%2F${{ steps.ucm.outputs.version }}/ucm-linux-arm64.tar.gz" -o ucm.tar.gz
          sudo mkdir -p /usr/local/lib/ucm
          sudo tar -xzf ucm.tar.gz -C /usr/local/lib/ucm
          sudo ln -sf /usr/local/lib/ucm/ucm /usr/local/bin/ucm
          rm ucm.tar.gz
          ucm version
          ./scripts/assert-ucm-version.sh
      - run: mix deps.get
      - run: mix test test/unex

  push:
    needs: test
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve pinned UCM version
        id: ucm
        run: echo "version=$(tr -d '[:space:]' < .ucm-version)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/kek/unex
          tags: |
            type=ref,event=branch

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            UCM_VERSION=${{ steps.ucm.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/kek/unex:buildcache
          cache-to: type=registry,ref=ghcr.io/kek/unex:buildcache,mode=max

      - name: Trigger deployment webhook
        if: success()
        run: |
          curl -f -X POST https://unex.karleklund.se/deploy-webhook \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"ref":"${{ github.ref }}","sha":"${{ github.sha }}"}'
